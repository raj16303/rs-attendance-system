<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3d91">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RS Attendance">
  <title>RS Attendance Management System</title>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <style>
    :root {
      --gov-blue: #0b3d91;
      --gov-blue-dark: #072a66;
      --gov-saffron: #ff9933;
      --glass-bg: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.35);
      --text-light: #f5f7fa;
      --danger: #e5484d;
      --success: #1fa971;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--gov-blue) 0%, #1b5fb0 45%, #0a2b63 100%);
      background-attachment: fixed;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
    }
    body::before {
      width: 420px; height: 420px;
      background: var(--gov-saffron);
      top: -120px; left: -120px;
    }
    body::after {
      width: 360px; height: 360px;
      background: #16a3c9;
      bottom: -100px; right: -100px;
    }
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 20px;
      padding: 36px 30px 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      color: var(--text-light);
      animation: rise 0.5s ease-out;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand {
      text-align: center;
      margin-bottom: 22px;
    }
    .brand .emblem {
      width: 56px; height: 56px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .brand h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .brand p {
      font-size: 11.5px;
      opacity: 0.85;
      margin-top: 4px;
      line-height: 1.4;
    }
    .app-name {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--gov-saffron);
      margin: 14px 0 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      opacity: 0.9;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .field input::placeholder { color: rgba(255,255,255,0.55); }
    .field input:focus {
      border-color: var(--gov-saffron);
      background: rgba(255,255,255,0.18);
    }
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--gov-saffron);
      color: #1a1200;
      font-weight: 700;
      font-size: 14.5px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      margin-top: 6px;
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(255,153,51,0.4); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(0,0,0,0.25);
      border-top-color: #1a1200;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn.loading .spinner { display: inline-block; }
    .btn.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .message {
      margin-top: 14px;
      font-size: 12.5px;
      padding: 10px 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.4;
    }
    .message.error { display: block; background: rgba(229,72,77,0.2); border: 1px solid rgba(229,72,77,0.45); }
    .message.success { display: block; background: rgba(31,169,113,0.2); border: 1px solid rgba(31,169,113,0.45); }
    .footer-credit {
      text-align: center;
      font-size: 10.5px;
      opacity: 0.7;
      margin-top: 22px;
      line-height: 1.5;
    }
    .toggle-pw {
      position: relative;
    }
    .toggle-pw button {
      position: absolute;
      right: 10px;
      top: 34px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      font-size: 11px;
      cursor: pointer;
    }
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 5;
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; border-radius: 20px; padding: 6px 12px; font-size: 11px; cursor: pointer;
    }
    body[data-theme="light"] { background: linear-gradient(135deg, #eef3fb 0%, #dbe7fb 45%, #f4f7fc 100%); }
    body[data-theme="light"] .card { background: rgba(11,61,145,0.06); border-color: rgba(11,61,145,0.18); color: #14213d; }
    body[data-theme="light"] .field input { background: rgba(11,61,145,0.05); border-color: rgba(11,61,145,0.25); color: #14213d; }
    body[data-theme="light"] .field input::placeholder { color: rgba(20,33,61,0.5); }
    body[data-theme="light"] .theme-toggle { background: rgba(11,61,145,0.08); border-color: rgba(11,61,145,0.25); color: #14213d; }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">🌙 Dark</button>
  <div class="card">
    <div class="brand">
      <div class="emblem">🏛️</div>
      <h1>Office of Block Chief Medical Officer, Banera, Bhilwara</h1>
      <p>Medical &amp; Health Department, Government of Rajasthan</p>
    </div>
    <div class="app-name">RS Attendance Management System</div>

    <form id="loginForm" onsubmit="return false;">
      <div class="field">
        <label for="employeeId">Employee ID</label>
        <input type="text" id="employeeId" placeholder="e.g. BCMO0001" autocomplete="username" required>
      </div>
      <div class="field toggle-pw">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" onclick="togglePassword()" id="toggleBtn">SHOW</button>
      </div>
      <button type="submit" class="btn" id="loginBtn" onclick="handleLogin()">
        <span class="spinner"></span>
        <span class="btn-text">Sign In</span>
      </button>
      <div class="message" id="message"></div>
    </form>

    <div class="footer-credit">
      RS Attendance Management System<br>
      Developed by RS Solanki, IA
    </div>
  </div>

  <script>
    function togglePassword() {
      const pw = document.getElementById('password');
      const btn = document.getElementById('toggleBtn');
      if (pw.type === 'password') { pw.type = 'text'; btn.textContent = 'HIDE'; }
      else { pw.type = 'password'; btn.textContent = 'SHOW'; }
    }

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + type;
    }

    function setLoading(isLoading) {
      const btn = document.getElementById('loginBtn');
      btn.disabled = isLoading;
      btn.classList.toggle('loading', isLoading);
    }

    function collectDeviceMeta() {
      return {
        userAgent: navigator.userAgent,
        screenResolution: screen.width + 'x' + screen.height,
        platform: navigator.platform || ''
      };
    }

    function handleLogin() {
      const employeeId = document.getElementById('employeeId').value.trim();
      const password = document.getElementById('password').value;

      if (!employeeId || !password) {
        showMessage('Please enter both Employee ID and Password.', 'error');
        return;
      }

      setLoading(true);
      document.getElementById('message').className = 'message';

      google.script.run
        .withSuccessHandler(function (result) {
          if (result.success) {
            showMessage('Login successful. Redirecting…', 'success');
            localStorage.setItem('rsams_token', result.sessionToken);
            localStorage.setItem('rsams_employee', JSON.stringify(result.employee));
            const isAdmin = result.employee.role === 'Admin' || result.employee.role === 'SuperAdmin';
            setTimeout(function () {
              window.location.href = isAdmin ? 'admin.html' : 'home.html';
            }, 400);
          } else {
            setLoading(false);
            showMessage(result.message || 'Login failed.', 'error');
          }
        })
        .withFailureHandler(function (err) {
          setLoading(false);
          showMessage('Server error: ' + (err && err.message ? err.message : err), 'error');
        })
        .login(employeeId, password, collectDeviceMeta());
    }

    (function redirectIfAlreadyLoggedIn() {
      const token = localStorage.getItem('rsams_token');
      const employeeRaw = localStorage.getItem('rsams_employee');
      if (!token || !employeeRaw) return;
      try {
        const employee = JSON.parse(employeeRaw);
        const isAdmin = employee.role === 'Admin' || employee.role === 'SuperAdmin';
        window.location.href = isAdmin ? 'admin.html' : 'home.html';
      } catch (e) { /* corrupted local data — just show the login form */ }
    })();

    document.getElementById('password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') handleLogin();
    });

    // ------------------------------------------------------------------
    // THEME (Module 8) — client-persisted, defaults to the admin's
    // configured THEME setting on first visit.
    // ------------------------------------------------------------------
    function applyTheme(theme) {
      document.body.setAttribute('data-theme', theme.toLowerCase());
      document.getElementById('themeToggleBtn').textContent = theme.toLowerCase() === 'light' ? '☀️ Light' : '🌙 Dark';
    }
    function toggleTheme() {
      const current = document.body.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem('rsams_theme', next);
      applyTheme(next);
    }
    (function initTheme() {
      const saved = localStorage.getItem('rsams_theme');
      if (saved) { applyTheme(saved); return; }
      google.script.run.withSuccessHandler(function (theme) {
        applyTheme(theme || 'DARK');
      }).getPublicTheme();
    })();
  </script>
</body>
</html>
